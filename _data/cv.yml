    Software:
      - name: IntervalMDP.jl
        url: https://github.com/zinoex/IntervalMDP.jl
        summary: >
          Hardware-accelerated robust value iteration for Interval Markov Decision Processes (IMDPs)
          and factored IMDPs (fIMDPs). [Julia]

      - name: IntervalMDPAbstractions.jl
        url: https://github.com/zinoex/IntervalMDPAbstractions.jl
        summary: >
          Formal verification and control synthesis of stochastic hybrid systems via symbolic-numeric
          abstractions to IMDPs and fIMDPs, value iteration, and controller refinement via simulation
          relations. [Julia]

      - name: bound_propagation
        url: https://github.com/zinoex/bound_propagation
        summary: >
          Linear Bound Propagation techniques (CROWN) for linear relaxations of non-linear functions
          including neural networks. [Python]

